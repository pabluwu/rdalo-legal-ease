name: Deploy Landing

on:
  push:
    branches:
      - main # Ajusta a 'master' si esa es tu rama

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            # Sin -e, un 'git pull' fallido no detiene el script: el rsync que
            # viene despues devuelve 0 y el deploy se reporta como exitoso
            # mientras publica codigo viejo. Paso de julio a septiembre de 2026
            # sin que nadie lo notara.
            set -euo pipefail

            # 1. Entrar a la carpeta y actualizar código
            cd ~/acuerdalo-landing/rdalo-legal-ease
            git pull origin main

            # Comprobacion explicita: el commit desplegado debe ser el que
            # disparo el workflow.
            LOCAL=$(git rev-parse HEAD)
            if [ "$LOCAL" != "${{ github.sha }}" ]; then
              echo "ERROR: el servidor quedo en $LOCAL pero se esperaba ${{ github.sha }}"
              exit 1
            fi
            echo "Codigo actualizado a $LOCAL"

            # 2. Instalar y construir
            npm install
            npm run build

            # 3. Mover archivos y reiniciar Nginx
            # Nota: Usamos sudo aquí. Asegúrate de que el usuario ubuntu tenga permisos NOPASSWD
            # --delete: sin esto el webroot acumula los HTML de builds anteriores.
            # Tras consolidar URLs en septiembre de 2026, /guias/*/marco-teorico y
            # /guias/divorcio siguieron devolviendo 200 con el contenido viejo,
            # duplicando las guias nuevas y con canonical apuntandose a si mismas.
            # Se excluye .well-known para no romper la renovacion de certificados.
            sudo rsync -av --delete --exclude='.well-known' \
              ~/acuerdalo-landing/rdalo-legal-ease/dist/ /var/www/acuerdalo/
            sudo systemctl reload nginx