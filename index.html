<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Acuérdalo" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Título, description y etiquetas og:*/twitter:* NO se declaran aquí:
      cada página las inyecta vía <Seo> (src/seo/Seo.tsx), que vite-react-ssg
      escribe en el <head> de cada HTML prerenderizado. Duplicarlas aquí
      produciría dos <title>/og:title por página.
    -->
    <!--
      Microsoft Clarity, cargado directamente y en dos partes separadas.

      Antes esto era Google Tag Manager, que pesaba 127 KB y encadenaba GA4
      (191 KB) y Clarity (25 KB): 354 KB de terceros por delante de 230 KB de
      aplicación, dentro del camino de un LCP que estaba en 7,2 s en móvil.
      Decidido quedarse solo con Clarity, mantener GTM era pagar el contenedor
      entero para entregar un script de 25 KB. Ver PLAN-SEO-OCT-2026.md §4.1.

      La cola `clarity` se crea AQUÍ, síncrona: cuesta nada y es lo que evita
      perder eventos. `registrarCalculo` (src/analytics/clarity.ts) no hace nada
      si la función no existe, así que un cálculo anterior a la llegada del
      script se perdería. Creada de antemano, las llamadas se encolan en
      `clarity.q` y el script las procesa al cargar — es el comportamiento del
      snippet oficial.

      La DESCARGA se difiere, con lo que ocurra primero: la primera interacción
      del usuario, o `load` + idle. Lo segundo cubre a quien lee sin tocar nada;
      lo primero garantiza que Clarity esté en marcha antes de cualquier evento,
      porque todos los que medimos requieren interacción previa.

      Adquisición y consultas las cubre Search Console, que no pesa en la página.
    -->
    <script>
      (function (w, d, s, n, i) {
        w[n] =
          w[n] ||
          function () {
            (w[n].q = w[n].q || []).push(arguments);
          };

        var cargado = false;
        function cargar() {
          if (cargado) return;
          cargado = true;
          var t = d.createElement(s),
            y = d.getElementsByTagName(s)[0];
          t.async = true;
          t.src = "https://www.clarity.ms/tag/" + i;
          y.parentNode.insertBefore(t, y);
        }

        function programar() {
          if ("requestIdleCallback" in w) w.requestIdleCallback(cargar, { timeout: 3000 });
          else w.setTimeout(cargar, 1500);
        }

        if (d.readyState === "complete") programar();
        else w.addEventListener("load", programar, { once: true });

        ["pointerdown", "keydown", "touchstart", "scroll"].forEach(function (evento) {
          w.addEventListener(evento, cargar, { once: true, passive: true });
        });
      })(window, document, "script", "clarity", "wjaumb7euk");
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <!-- Sin `noscript`: Clarity graba sesiones, y sin JS no hay sesión que grabar. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
